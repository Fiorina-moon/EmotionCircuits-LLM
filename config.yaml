# ============================================================
# EmotionCircuits-LLM 运行配置
# 所有脚本与 quick_start.py 共用本文件；以下环境变量可覆盖对应项：
#   MODEL_PATH   覆盖 model.local_path
#   MODEL_ID     覆盖 model.hf_id
#   OUTPUT_DIR   覆盖 paths.output_dir
#   HF_ENDPOINT  覆盖 huggingface.endpoint
#   HF_TOKEN / OPENAI_API_KEY 通过 .env 或环境变量提供
# ============================================================

model:
  # 本地模型目录（相对仓库根目录或绝对路径）；目录不存在时回退到 hf_id
  local_path: models/Llama-3.2-3B-Instruct
  hf_id: meta-llama/Llama-3.2-3B-Instruct
  # 运行时默认设备：auto / cuda:0 / cpu
  device: auto
  # 运行时默认精度：float32 / float16 / bfloat16
  dtype: float32

paths:
  # 个人运行产物目录（已在 .gitignore 中排除，不会污染仓库自带的 outputs/）
  output_dir: outputs_local
  # 仓库自带的已发布产物目录（作者的预跑结果）
  repo_output_dir: outputs
  # 是否允许回退到 repo_output_dir：
  #   false（默认）= 只用自己的产物，个人目录缺文件就报错，避免混用作者结果
  #   true          = 个人目录缺文件时读取作者结果（旧的混合模式）
  repo_fallback: false
  # 输出子目录名，沿用仓库约定（llama32_3b）
  model_name: llama32_3b
  # quick_start 演示结果目录（相对仓库根目录，与仓库自带的 quick_start_outputs/ 并列）
  quick_start_output_dir: quick_start_output_local

huggingface:
  # 可设为 https://hf-mirror.com 等镜像；留空则使用官方地址
  endpoint: ""
  # 仅在使用远程模型且提供 HF_TOKEN 时登录；本地模型始终不联网
  login: true

# 文本打标渠道（阶段 01/03/07 的 label_* 脚本共用）
# Text labeling channel (shared by the label_* scripts in stages 01/03/07)
labeling:
  # OpenAI 兼容接口地址
  base_url: https://llmapi.paratera.com/v1
  model: Qwen3.5-397B-A17B
  # 从 .env / 环境变量读取的 key 名称；未设置时回退到 OPENAI_API_KEY
  api_key_env: LABEL_API_KEY
